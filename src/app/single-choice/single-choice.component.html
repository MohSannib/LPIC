<h2>Lernen</h2>

<div class="container" *ngFor="let question of questions; let i = index" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 20px;">
  <div style="text-align: center; font-size: larger; font-weight: bold;">
    <span style="display: inline-block;">Frage {{i+1}} / {{questions.length}}</span>
  </div>
  <p>{{ question.frage }}</p>
  <div *ngFor="let answer of question.antworten" [style.color]="getAnswerColor(answer)">
    {{ answer.option }}
  </div>
  <div style="clear: both;"></div> 
  <div style="float: right;">
    <button class="btn btn-success" style="margin-top: 10px;" (click)="showAnswer(question, i)">Antwort zeigen</button>
  </div>
</div>
